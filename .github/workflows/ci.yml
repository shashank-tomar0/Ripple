name: Ripple CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  # The app targets modern Flutter APIs (CardThemeData, WidgetStateProperty,
  # Icons.hub_outline), so CI tracks the latest stable release.

jobs:
  # ── Go Daemon (build + vet + tests) ──
  # These steps must pass: no `|| true` escapes. If the daemon doesn't
  # build or a test fails, CI goes red.
  go-daemon:
    name: Go Daemon (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-daemon/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go build
        run: go build -o rippled ./cmd/rippled

      - name: Run unit tests (with race detector)
        run: go test -race ./...

      - name: Run routing benchmark (claims gate)
        run: go run ./cmd/routingbench

  # ── Flutter App (analyze + tests) ──
  flutter-app:
    name: Flutter App (analyze + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Analyze gates on errors (which always fail); style lints are tracked
      # as debt for a cleanup pass rather than blocking the pipeline.
      - name: Run flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: flutter test

      - name: Build debug APK (verify compiles)
        run: flutter build apk --debug

  # ── Integration Test: real multi-hop delivery across a 3-node chain ──
  # Runs scripts/integration_test.sh (single source of truth, same script
  # runs locally via `make integration`). Topology is a linear chain
  # node1↔node2↔node3 with mDNS disabled, so node3 can ONLY be reached
  # through node2's store-and-forward relay. The script asserts relay
  # events on node2's bridge and a delivery-receipt round trip to node1.
  integration-test:
    name: Integration Test (3-node relay chain)
    needs: [go-daemon, flutter-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-daemon/go.sum

      - name: Run integration test
        run: bash scripts/integration_test.sh

  # ── Docker Image Build ──
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ripple/rippled:test ./go-daemon

      - name: Test image runs
        run: |
          docker run --rm -d --name test-rippled ripple/rippled:test \
            -port 9000 -wsport 9876 -nick testnode -data /data
          sleep 8
          RUNNING=$(docker inspect -f '{{.State.Running}}' test-rippled)
          if [ "$RUNNING" != "true" ]; then
            echo "❌ container is not running"
            docker logs test-rippled
            exit 1
          fi
          if docker logs test-rippled | grep -q "Ripple is running"; then
            echo "✅ daemon started inside container"
          else
            echo "❌ daemon did not report a clean startup"
            docker logs test-rippled
            docker stop test-rippled
            exit 1
          fi
          docker stop test-rippled
